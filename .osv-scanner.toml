id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer < 0.12.1 is reached only via gaoya 0.2.2 → sha-1 0.10 (simhash text hashing); gaoya has no newer release. The bug requires catching a panic from inside a compression callback and reusing the buffer, which dirge's usage never does"
